global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: vle-8-blue-green
    experiment: vle-8

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: myapp-blue
    metrics_path: /metrics
    static_configs:
      - targets: ["blue-1:8080", "blue-2:8080"]
        labels:
          app: myapp
          color: blue
          version: v1

  - job_name: myapp-green
    metrics_path: /metrics
    static_configs:
      - targets: ["green-1:8080", "green-2:8080"]
        labels:
          app: myapp
          color: green
          version: v2

