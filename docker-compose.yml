version: "3.8"

services:
  dashboard:
    build: .
    command: ["node", "server.js"]
    container_name: vle8-dashboard
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SWITCHER_URL: http://switcher:8090
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://grafana:3000
      ALERTMANAGER_URL: http://alertmanager:9093
      BLUE_UPSTREAMS: http://blue-1:8080,http://blue-2:8080
      GREEN_UPSTREAMS: http://green-1:8080,http://green-2:8080
    depends_on:
      - switcher
      - prometheus
      - grafana
      - alertmanager
    networks:
      - vle8-net
    restart: unless-stopped

  switcher:
    build: .
    command: ["node", "src/switcher.js"]
    container_name: vle8-switcher
    ports:
      - "8090:8090"
    environment:
      PORT: 8090
      ACTIVE_COLOR: blue
      BLUE_UPSTREAMS: http://blue-1:8080,http://blue-2:8080
      GREEN_UPSTREAMS: http://green-1:8080,http://green-2:8080
    depends_on:
      - blue-1
      - blue-2
      - green-1
      - green-2
    networks:
      - vle8-net
    restart: unless-stopped

  blue-1:
    build: .
    container_name: vle8-blue-1
    environment:
      PORT: 8080
      APP_COLOR: blue
      APP_VERSION: v1
      REPLICA_ID: blue-1
    networks:
      - vle8-net
    restart: unless-stopped

  blue-2:
    build: .
    container_name: vle8-blue-2
    environment:
      PORT: 8080
      APP_COLOR: blue
      APP_VERSION: v1
      REPLICA_ID: blue-2
    networks:
      - vle8-net
    restart: unless-stopped

  green-1:
    build: .
    container_name: vle8-green-1
    environment:
      PORT: 8080
      APP_COLOR: green
      APP_VERSION: v2
      REPLICA_ID: green-1
    networks:
      - vle8-net
    restart: unless-stopped

  green-2:
    build: .
    container_name: vle8-green-2
    environment:
      PORT: 8080
      APP_COLOR: green
      APP_VERSION: v2
      REPLICA_ID: green-2
    networks:
      - vle8-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vle8-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - vle8-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: vle8-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - vle8-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: vle8-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - vle8-net
    restart: unless-stopped

networks:
  vle8-net:
    driver: bridge
